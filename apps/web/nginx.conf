server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # App CSR (SPA) — chat sau đăng nhập (/app, /app/messages/:id, /app/documents)
    # VÀ các trang auth (login/register/verify-email/forgot-password) đều thuộc
    # bundle CSR main.tsx (xem App.tsx) — fallback về app/index.html để React
    # Router xử lý client-side. Khớp đúng danh sách APP_PREFIXES trong
    # vite.config.ts's devMpaRoutingPlugin (dev-mode tương đương).
    # Thử $uri/index.html (FILE) trước, KHÔNG thử $uri/ (thư mục) — "/app" là
    # một thư mục thật trên đĩa (dist/app/), nếu match $uri/ trước sẽ bị nginx
    # tự 301 redirect thêm "/" giống hệt vấn đề ở block landing bên dưới.
    location ~ ^/(app|login|register|verify-email|forgot-password)(/|$) {
        try_files $uri $uri/index.html /app/index.html;
    }

    # Landing pages (SSG) — mỗi route/locale (/, /pricing, /features, /en/...)
    # đã là file HTML tĩnh thật từ bước prerender, không cần SPA fallback.
    # Thử $uri/index.html (FILE thật) trước $uri/ (thư mục) — nếu để $uri/ khớp
    # trước, nginx tự 301 redirect thêm dấu "/" (hành vi mặc định khi resolve
    # ra một thư mục), gây round-trip thừa cho /pricing, /features, /en/...
    # Không cache dài hạn: nội dung có thể đổi giữa các lần deploy (khác
    # /assets/ vốn có hash trong filename nên cache 1 năm là an toàn).
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to Fastify gateway
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Chuyển tiếp chuỗi IP thật xuống Fastify. Thiếu dòng này thì req.ip của
        # Fastify = IP của CHÍNH container nginx (172.18.0.x) cho MỌI người dùng,
        # nên @fastify/rate-limit gộp cả Internet vào một bucket: đo trên
        # production, hạn mức "20 chat/phút" hoá ra là 20 cho toàn hệ thống, ai
        # gửi thứ 21 trong phút đó cũng bị 429 dù chưa gửi gì.
        # (reverse proxy ngoài cùng đã set X-Forwarded-For đúng — chuỗi đứt ở đây.)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # long timeout for SSE streaming
        proxy_buffering off;       # disable buffering for SSE
    }

    # Proxy suggestions to Go agent directly (optional, for speed)
    location /suggestions {
        set $agent_upstream http://agent-go:3002;
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
