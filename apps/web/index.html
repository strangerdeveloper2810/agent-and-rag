<!doctype html>
<html lang="vi" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!--
      Đây là TEMPLATE cho landing page (SSG), không phải app CSR (xem app/index.html
      cho app CSR ở /app). Title/description/canonical/hreflang/OG/JSON-LD được
      scripts/prerender.mjs chèn riêng cho từng trang, từng locale, ngay TRƯỚC thẻ
      đóng head và bên trong div root — xem prerender.mjs để biết chi tiết.
      KHÔNG hard-code lại các thẻ SEO ở đây, tránh trùng/lệch với nội dung thật.
      LƯU Ý: không viết literal đóng-thẻ head hay div root trong comment này —
      Vite's html transform tìm chuỗi đó theo text thô, viết ra sẽ bị chèn nhầm.
    -->

    <!-- ── Mobile & App Theme ── -->
    <meta name="theme-color" content="#08090d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="J.A.R.V.I.S." />
    <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── Icons & Web App Manifest ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Google Fonts Preconnect ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/modules/landing/entry-landing-client.tsx"
    ></script>
  </body>
</html>
