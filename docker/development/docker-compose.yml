# ── J.A.R.V.I.S. — Development Stack ──
# Chỉ chạy các service cần thiết cho local dev.
# Code (api, web, agent-go) chạy qua `pnpm dev` trên máy host.
# MongoDB: ưu tiên Atlas cloud (MONGODB_URI trong .env). Nếu không có Atlas,
# dùng MongoDB local trong compose này.
# Env vars: env/.env.development
#
# Start: pnpm docker:dev
# Stop:  pnpm docker:dev:down

services:
  # ── MongoDB (chat history, documents, tasks, RAG) ──
  mongo:
    image: mongo:8
    container_name: jarvis-development-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── PostgreSQL (Auth DB: users, credentials, refresh tokens) ──
  postgres:
    image: postgres:17-alpine
    container_name: jarvis-development-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../../env/.env.development
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d ai_agent_tut"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Redis (rate limiting, embedding/chat/tool cache) ──
  redis:
    image: redis:7-alpine
    container_name: jarvis-development-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MinIO (S3-compatible object storage — ảnh, doc, file agent tạo) ──
  minio:
    image: minio/minio:latest
    container_name: jarvis-development-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console (http://localhost:9001)
    env_file:
      - ../../env/.env.development
    volumes:
      - minio_dev:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_dev:
    driver: local
  pgdata_dev:
    driver: local
  redis_dev:
    driver: local
  minio_dev:
    driver: local
