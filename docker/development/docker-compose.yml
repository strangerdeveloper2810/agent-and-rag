# ── J.A.R.V.I.S. — Development Stack ──
# Chỉ chạy các service cần thiết cho local dev.
# Code (api, web, agent-go) chạy qua `pnpm dev` trên máy host.
# MongoDB dùng Atlas cloud.
# Env vars: env/.env.development
#
# Start: docker compose -f docker/development/docker-compose.yml up -d
# Stop:  docker compose -f docker/development/docker-compose.yml down

services:
  # ── PostgreSQL (Auth DB: users, credentials, refresh tokens) ──
  postgres:
    image: postgres:17-alpine
    container_name: jarvis-development-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../../env/.env.development
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d ai_agent_tut"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Redis (rate limiting, embedding/chat/tool cache) ──
  redis:
    image: redis:7-alpine
    container_name: jarvis-development-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata_dev:
    driver: local
  redis_dev:
    driver: local
