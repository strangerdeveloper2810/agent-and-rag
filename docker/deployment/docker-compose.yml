# ── J.A.R.V.I.S. — Deployment Stack ──
# Env vars: env/.env (copy từ env/.env.example và điền giá trị thật)
#
# Start: docker compose -f docker/deployment/docker-compose.yml up -d
# Stop:  docker compose -f docker/deployment/docker-compose.yml down
# Logs:  docker compose -f docker/deployment/docker-compose.yml logs -f

services:
  # ── PostgreSQL (Auth DB: users, credentials, refresh tokens) ──
  postgres:
    image: postgres:17-alpine
    container_name: jarvis-postgres
    restart: unless-stopped
    # Không publish port ra host: chỉ service khác trong compose (api) cần nối
    # tới, qua network `jarvis` nội bộ là đủ. Tránh publish "5432:5432" trên
    # VPS dùng chung — Docker tự chèn rule iptables CÓ THỂ đi vòng qua UFW,
    # lộ DB ra internet dù UFW không cho phép port đó (lỗ hổng Docker+UFW đã
    # biết); cũng tránh đụng port với service khác trên cùng VPS.
    env_file:
      - ../../env/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d ai_agent_tut"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis

  # ── Redis (rate limiting, embedding/chat/tool cache) ──
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    # Không publish port ra host — xem giải thích ở service postgres.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis

  # ── MinIO (S3-compatible object storage — ảnh, doc, file agent tạo) ──
  minio:
    image: minio/minio:latest
    container_name: jarvis-minio
    restart: unless-stopped
    # Không publish port ra host. Cần vào console quản trị (9001) thì SSH
    # tunnel tạm: `ssh -L 9001:localhost:9001 hr-vps` rồi mở localhost:9001 —
    # an toàn hơn mở vĩnh viễn ra internet trên VPS dùng chung.
    env_file:
      - ../../env/.env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-jarvisadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis

  # ── Go Agent Runtime (trái tim) ──
  agent-go:
    build:
      context: ../../services/agent-go
      dockerfile: Dockerfile
    image: jarvis-agent-go:latest
    container_name: jarvis-agent-go
    restart: unless-stopped
    # Không publish port ra host — chỉ `api` và `web` (qua /suggestions) gọi
    # tới nội bộ qua network `jarvis`, không cần truy cập trực tiếp từ ngoài.
    env_file:
      - ../../env/.env
    environment:
      - PORT=3002
      - JARVIS_DB_PATH=/data/jarvis.db
      - JARVIS_SKILLS_DIR=/skills
    volumes:
      - jarvis_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis

  # ── API Gateway (Fastify/TS BFF) ──
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: jarvis-api:latest
    container_name: jarvis-api
    restart: unless-stopped
    # Không publish port ra host — `web` (nginx trong container) đã proxy
    # /api/ tới api:3001 nội bộ qua network `jarvis` (xem apps/web/nginx.conf).
    env_file:
      - ../../env/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - AGENT_BACKEND=go
      - AGENT_GO_URL=http://agent-go:3002
      - AGENT_GO_TIMEOUT=120000
    depends_on:
      agent-go:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - jarvis

  # ── Frontend (React/Vite → nginx) ──
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: jarvis-web:latest
    container_name: jarvis-web
    restart: unless-stopped
    # 80/443 đã bị chiếm bởi hr-nginx (VPS dùng chung) — dùng port riêng.
    # Đổi qua env WEB_HOST_PORT nếu VPS khác cần port khác.
    ports:
      - "${WEB_HOST_PORT:-8090}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis

networks:
  jarvis:
    driver: bridge

volumes:
  jarvis_data:
    driver: local
  pgdata:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
