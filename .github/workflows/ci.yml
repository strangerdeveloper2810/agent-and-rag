name: CI

on:
  push:
    branches: [master]
  pull_request:

# Hủy run cũ khi có push mới lên cùng branch/PR (tiết kiệm CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phát hiện phía nào thay đổi để chỉ chạy CI phía đó.
  # Chỉ đổi docs/*.md/.claude... (không nằm trong filter) → cả backend lẫn
  # frontend đều bị skip (điều kiện `if` = false).
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      agent_go: ${{ steps.filter.outputs.agent_go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.github/workflows/**'
            backend:
              - *shared
              - 'apps/api/**'
            frontend:
              - *shared
              - 'apps/web/**'
            agent_go:
              - *shared
              - 'services/agent-go/**'

  backend:
    needs: detect
    if: ${{ needs.detect.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node (từ .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck + Test + Build (API)
        run: pnpm exec turbo run typecheck test build --filter=@app/api
      - name: Lint (API)
        run: pnpm exec eslint apps/api
      - name: Format check (API)
        run: pnpm exec prettier --check apps/api

  frontend:
    needs: detect
    if: ${{ needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node (từ .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck + Test + Build (Web)
        run: pnpm exec turbo run typecheck test build --filter=@app/web
      - name: Lint (Web)
        run: pnpm exec eslint apps/web
      - name: Format check (Web)
        run: pnpm exec prettier --check apps/web

  agent-go:
    needs: detect
    if: ${{ needs.detect.outputs.agent_go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/agent-go/go.mod
      - name: Vet + Test + Build
        working-directory: services/agent-go
        run: go vet ./... && go test ./... && go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/agent-go

  # Gate tổng: 1 status check duy nhất để đặt "required" trong branch protection.
  # Xanh khi các job con success HOẶC bị skip (chỉ đổi docs); đỏ nếu có job fail.
  ci-success:
    if: always()
    needs: [detect, backend, frontend, agent-go]
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra kết quả các job
        run: |
          echo "detect=${{ needs.detect.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} agent-go=${{ needs.agent-go.result }}"
          if [ "${{ needs.detect.result }}" = "failure" ] || \
             [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.agent-go.result }}" = "failure" ]; then
            echo "Có job CI thất bại"; exit 1
          fi
          echo "CI OK (job không liên quan đã được skip)"
