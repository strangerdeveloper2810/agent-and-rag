name: CI

on:
  push:
    branches: [master]
  pull_request:

# Hủy run cũ khi có push mới lên cùng branch/PR (tiết kiệm CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm đọc version từ trường "packageManager" trong package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (từ .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
