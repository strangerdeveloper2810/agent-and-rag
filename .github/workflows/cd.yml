name: CD Auto Deployment

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    # Chỉ deploy khi CI workflow trên branch master chạy thành công 100% (hoặc bấm manual dispatch)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH Key & Host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Ghi private key với newline cuối dòng hợp lệ
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          sed -i -e '$a\' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Làm sạch hostname (loại bỏ http://, https://, whitespace, trailing slash)
          CLEAN_HOST=$(echo "$VPS_HOST" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d ' \n\r\t')
          CLEAN_USER=$(echo "${VPS_USER:-root}" | tr -d ' \n\r\t')
          CLEAN_PORT=$(echo "${VPS_PORT:-22}" | tr -d ' \n\r\t')

          if [ -z "$CLEAN_HOST" ]; then
            echo "❌ Lỗi: Secret VPS_HOST chưa được cấu hình hoặc rỗng!"
            exit 1
          fi

          # Cấu hình SSH client profile cho target VPS
          cat <<EOF > ~/.ssh/config
          Host vps-target
            HostName $CLEAN_HOST
            User $CLEAN_USER
            Port $CLEAN_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 ~/.ssh/config

          # Quét known_hosts trước
          ssh-keyscan -p "$CLEAN_PORT" -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync source code to VPS (Rsync)
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.turbo' \
            --exclude 'dist' \
            --exclude 'coverage' \
            --exclude 'env/.env*' \
            --exclude '.claude' \
            ./ vps-target:/opt/jarvis/

      - name: Build & Restart Docker Services
        run: |
          ssh vps-target "
            cd /opt/jarvis && \
            WEB_HOST_PORT=8090 docker compose -f docker/deployment/docker-compose.yml up -d --build && \
            docker image prune -f
          "

      - name: Verify Live Service Health
        run: |
          echo "Kiểm tra endpoint production sau khi deploy..."
          sleep 8
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ai.ethansoftwaredeveloper.com/api/healthz || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Healthcheck passed: HTTP 200 OK"
              exit 0
            fi
            echo "Thử lại lần $i (Status: $STATUS)... đợi 5s"
            sleep 5
          done
          echo "❌ Lỗi: Service không phản hồi 200 OK sau deploy"
          exit 1
